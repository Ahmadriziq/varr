<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aplikasi Edukasi Dinosaurus WebAR</title>
  
  
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="margin: 0px; overflow: hidden;">

  
  <div id="landing-page">
    <div class="landing-content">
      <h1>LABORATORIUM DINO AR</h1>
      <p>Pilih dinosaurus di bawah ini, lalu arahkan kamera ke gambarnya:</p>
      <div class="card-grid" id="card-grid"></div>
    </div>
  </div>

  
  <div id="ar-ui" style="display: none;">
    <button id="back-btn">← Kembali ke Menu</button>
    <div id="info-panel">
      <h2 id="dino-title">Nama Dinosaurus</h2>
      <p id="dino-stats">Kategori | Era</p>
      <p id="dino-desc">Arahkan kamera ke gambar untuk melihat hologram...</p>
    </div>
  </div>

  
  <div id="ar-container"></div>

  <script src="js/app.js"></script>
</body>
</html>
